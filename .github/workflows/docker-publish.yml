# Publishes the production image to GHCR on every push to main (and on demand).
#
# Image: ghcr.io/jwfrancois/feishin
#   :latest      — newest main build (amd64 + arm64)
#   :sha-xxxxxxx — image for an exact commit
#
# The image inherits the repo's visibility: while the repo is private the
# package is private too, so pulls need a GitHub token with read:packages:
#   echo <TOKEN> | docker login ghcr.io -u jwfrancois --password-stdin
# (or make the package public: GitHub -> Packages -> feishin -> Package settings)

name: docker-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 builds run under QEMU — oven/bun and the Next.js standalone
      # runtime are both multi-arch, so the same Dockerfile serves a Raspberry
      # Pi / ARM NAS as well as x86 servers
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
